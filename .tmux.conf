# # 启用 true color 支持
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

set -g @plugin 'tmux-plugins/tpm'
# 插件列表由#括起来
#############################

set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_style 'mocha'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'

##############################
run '~/.tmux/plugins/tpm/tpm'



# -----------------------------
# 设置前导键为 ctrl-x
# -----------------------------
unbind c-b               # 取消默认前导键 ctrl-b
set-option -g prefix c-x
bind c-x send-prefix

# -----------------------------
# 自定义窗口分割快捷键
# -----------------------------
# ctrl-x | -> 垂直分割窗口（split-window -h）
bind | split-window -h -c "#{pane_current_path}"

# ctrl-x _ -> 水平分割窗口（split-window -v）
bind _ split-window -v -c "#{pane_current_path}"

# 新窗口继承当前目录
# bind c new-window -c "#{pane_current_path}"

# tmux 2.1 及以上版本
set-option -g mouse on

# 可选：取消 tmux-navigator 的 Ctrl+方向键
unbind -n C-Left
unbind -n C-Right

# Alt+Left → 上一个窗口
bind -n M-h previous-window

# Alt+Right → 下一个窗口
bind -n M-l next-window

# 使用 vi 模式进行文本选择和复制
setw -g mode-keys vi

bind-key f popup -d "#{pane_current_path}" -w 80% -h 80% -E "$SHELL"

bind b break-pane

# 使用i键来退出编译模式，操作习惯保持和vim一致
bind-key -T copy-mode-vi i send-keys -X cancel
# 使用v来进入visual模式，而不是space
bind-key -T copy-mode-vi v send-keys -X begin-selection
